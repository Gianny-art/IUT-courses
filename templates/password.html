{% extends "base.html" %}

{% block content %}
<div class="password-container">
    <h1></h1>Accès aux Formations</h1><br><br>
    <small>acces premium requis</small><br><br>
    <form method="POST">
        <label for="password">Entrez le mot de passe :</label>
        <input type="password" name="password" required>
        <button type="submit">Valider</button>
    </form>
    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
</div>

<style>
.password-container {
    max-width: 400px;
    margin: 50px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    text-align: center;
}
</style>
{% endblock %}
