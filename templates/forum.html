{% extends "base.html" %}

{% block content %}
<div class="forum-container">
    <div class="chat-messages" id="messages">
        {% for message in messages %}
        <div class="message {% if message.user_id == session.user_id %}sent{% else %}received{% endif %}">
            <strong>{{ message.username }}</strong>
            <p>{{ message.content }}</p>
            <span class="time">{{ message.created_at }}</span>
        </div>
        {% endfor %}
    </div>
    
    <div class="chat-input">
        <input type="text" id="message" placeholder="Tapez votre message...">
        <button onclick="sendMessage()" class="send-btn">Envoyer</button>
        <button onclick="shareToWhatsApp()" class="whatsapp-btn">
          <span>📱 Continuer sur WhatsApp</span>
        </button>
    </div>
</div>

<script>
    // @ts-ignore
    const UNITE_ID = {{ unite_id | tojson }};
    // @ts-ignore
    const SESSION_USER_ID = {{ session.get('user_id') | tojson }};

    async function sendMessage() {
        const input = document.getElementById('message');
        const content = input.value.trim();
        if (!content) return;
        try {
            const res = await fetch(`/forum/unit/${UNITE_ID}/message`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content, share_whatsapp: true })
            });
            const data = await res.json();
            if (data.ok) {
                appendMessage(data.message);
                input.value = '';
            } else {
                alert(data.error || 'Erreur lors de l\'envoi du message');
            }
        } catch (e) {
            console.error(e);
            alert('Erreur réseau');
        }
    }

    function appendMessage(m) {
        const messagesDiv = document.getElementById('messages');
        if (!messagesDiv) return;
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${m.user_id == SESSION_USER_ID ? 'sent' : 'received'}`;
        messageDiv.innerHTML = `
            <strong>${m.username}</strong>
            <p>${m.content}</p>
            <span class="time">${m.created_at}</span>
        `;
        // prepend to keep newest on top as server renders descending
        messagesDiv.prepend(messageDiv);
    }

    function shareToWhatsApp() {
        const messages = Array.from(document.querySelectorAll('.message')).map(msg => {
            const username = msg.querySelector('strong') ? msg.querySelector('strong').textContent : '';
            const content = msg.querySelector('p') ? msg.querySelector('p').textContent : '';
            return `${username}: ${content}`;
        }).join('\n');
        const whatsappText = `Messages du forum ${UNITE_ID}:\n\n${messages}`;
        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(whatsappText)}`;
        window.open(whatsappUrl);
    }

    // Permettre l'envoi avec la touche Entrée
    const msgInputEl = document.getElementById('message');
    if (msgInputEl) {
        msgInputEl.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    }
</script>

<style>
/* ...styles existants... */

.whatsapp-btn {
    background: #25D366;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-left: 10px;
    margin-top: 20px;
}

.whatsapp-btn:hover {
    background: #128C7E;
}

.message {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 8px;
    max-width: 70%;
    word-wrap: break-word;
}

.message.sent {
    background: #007bff;
    color: white;
    margin-left: auto;
}

.message.received {
    background: #e9ecef;
    color: #212529;
}

.message strong {
    font-size: 0.9em;
    display: block;
    margin-bottom: 5px;
}

.message .time {
    font-size: 0.8em;
    opacity: 0.7;
    display: block;
    margin-top: 5px;
}
</style>
{% endblock %}
